name: ForgeBench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      n_prompts:
        description: "Number of prompts to run"
        default: "10"
      difficulty:
        description: "Tier filter: beginner | intermediate | advanced | enterprise (blank = mixed)"
        default: "beginner"
      label:
        description: "Human-readable run label"
        default: ""

jobs:
  forgebench:
    name: ForgeBench
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONIOENCODING: utf-8
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node.js 20 (for frontend build validation)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright chromium
        run: python -m playwright install chromium --with-deps
        continue-on-error: true

      - name: Determine run parameters
        id: params
        run: |
          N="${{ github.event.inputs.n_prompts }}"
          N="${N:-5}"
          DIFF="${{ github.event.inputs.difficulty }}"
          DIFF="${DIFF:-beginner}"
          LABEL="${{ github.event.inputs.label }}"
          LABEL="${LABEL:-${GITHUB_SHA::8}}"
          VER=$(git describe --tags --always 2>/dev/null || echo "v17")
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "diff=$DIFF" >> $GITHUB_OUTPUT
          echo "label=$LABEL" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "run_id=${LABEL}" >> $GITHUB_OUTPUT

      - name: Run ForgeBench
        id: bench
        run: |
          cd backend
          ARGS="--n ${{ steps.params.outputs.n }}"
          ARGS="$ARGS --difficulty ${{ steps.params.outputs.diff }}"
          ARGS="$ARGS --label ${{ steps.params.outputs.label }}"
          ARGS="$ARGS --version ${{ steps.params.outputs.version }}"
          ARGS="$ARGS --pipeline v7"
          echo "Running: python run_benchmark.py $ARGS"
          python run_benchmark.py $ARGS 2>&1 | tee bench_output.txt
        continue-on-error: true

      - name: Locate report
        id: report
        if: always()
        run: |
          REPORT=$(find backend/benchmark_results -name "report.md" | sort | tail -1)
          echo "path=$REPORT" >> $GITHUB_OUTPUT

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgebench-${{ github.sha }}
          path: |
            backend/benchmark_results/
            backend/bench_output.txt
          retention-days: 30

      - name: Post results to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const glob = require('@actions/glob');

            const globber = await glob.create('backend/benchmark_results/*/report.md');
            const files = await globber.glob();

            let body = `## ForgeBench Results\n\n**Commit:** \`${context.sha.slice(0,8)}\`\n\n`;

            if (files.length > 0) {
              const md = fs.readFileSync(files[files.length - 1], 'utf8');
              body += md.slice(0, 4000);
            } else {
              const output = fs.existsSync('backend/bench_output.txt')
                ? fs.readFileSync('backend/bench_output.txt', 'utf8').slice(-2000)
                : 'No output captured.';
              body += `**No report generated.** Last output:\n\`\`\`\n${output}\n\`\`\``;
            }

            body += `\n\n> [Full artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 65536),
            });

  # Full benchmark (manual only — costs money)
  forgebench-full:
    name: ForgeBench Full (100 prompts)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.n_prompts == '100'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONIOENCODING: utf-8
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: python -m playwright install chromium --with-deps
        continue-on-error: true

      - name: Run full ForgeBench (100 prompts)
        run: |
          cd backend
          VER=$(git describe --tags --always 2>/dev/null || echo "v17")
          python run_benchmark.py \
            --all \
            --label "full-${{ github.sha }}" \
            --version "$VER" \
            --pipeline v7 \
            --max-cost 10.00 \
            2>&1 | tee bench_output_full.txt
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgebench-full-${{ github.sha }}
          path: |
            backend/benchmark_results/
            backend/bench_output_full.txt
          retention-days: 90
